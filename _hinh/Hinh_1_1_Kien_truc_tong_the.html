<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; }
  svg { display: block; font-family: 'Times New Roman', Times, serif; }
  .khung { fill: #fff; stroke: #333; stroke-width: 1.6; }
  .tang { fill: #f4f6f9; stroke: #556; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .lop { fill: #e8edf5; stroke: #334; stroke-width: 1.4; }
  .tichhop { fill: #fdf3e3; stroke: #8a6d3b; stroke-width: 1.4; }
  .ngoai { fill: #fff; stroke: #333; stroke-width: 1.4; }
  .tieude { font-size: 21px; font-weight: bold; fill: #111; }
  .ten { font-size: 18px; font-weight: bold; fill: #111; }
  .nho { font-size: 15.5px; fill: #222; }
  .nhan { font-size: 15px; fill: #222; font-style: italic; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
  .mui { stroke: #222; stroke-width: 1.8; fill: none; marker-end: url(#m); }
  .mui2 { stroke: #222; stroke-width: 1.8; fill: none; marker-end: url(#m); marker-start: url(#m0); }
</style></head><body>
<svg id="hinh" width="1500" height="900" viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="m0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#222"/></marker>
  </defs>

  <!-- ===== Cot 1: nguoi dung ===== -->
  <rect class="tang" x="20" y="60" width="250" height="560" rx="10"/>
  <text class="tieude" x="145" y="45" text-anchor="middle">Người dùng</text>
  <rect class="khung" x="40" y="80" width="210" height="300" rx="8"/>
  <text class="ten" x="145" y="110" text-anchor="middle">Trình duyệt web</text>
  <text class="nho" x="145" y="135" text-anchor="middle">(máy tính, điện thoại)</text>
  <g class="nho">
    <rect class="lop" x="60" y="155" width="170" height="40" rx="6"/><text x="145" y="181" text-anchor="middle">Sale</text>
    <rect class="lop" x="60" y="205" width="170" height="40" rx="6"/><text x="145" y="231" text-anchor="middle">Vận hành</text>
    <rect class="lop" x="60" y="255" width="170" height="40" rx="6"/><text x="145" y="281" text-anchor="middle">Kế toán</text>
    <rect class="lop" x="60" y="305" width="170" height="40" rx="6"/><text x="145" y="331" text-anchor="middle">Admin</text>
  </g>
  <rect class="khung" x="40" y="420" width="210" height="80" rx="8"/>
  <text class="ten" x="145" y="452" text-anchor="middle">Khách hàng</text>
  <text class="nho" x="145" y="477" text-anchor="middle">xem báo giá qua đường dẫn</text>
  <rect class="khung" x="40" y="520" width="210" height="80" rx="8"/>
  <text class="ten" x="145" y="552" text-anchor="middle">Người duyệt chi,</text>
  <text class="ten" x="145" y="575" text-anchor="middle">Nhà cung cấp</text>
  <text class="nho" x="145" y="596" text-anchor="middle">qua nhóm Telegram ↓</text>

  <!-- ===== Cot 2: tang giao dien ===== -->
  <rect class="tang" x="320" y="60" width="270" height="440" rx="10"/>
  <text class="tieude" x="455" y="45" text-anchor="middle">Tầng giao diện</text>
  <rect class="khung" x="340" y="80" width="230" height="400" rx="8"/>
  <text class="ten" x="455" y="112" text-anchor="middle">Ứng dụng một trang</text>
  <text class="ten" x="455" y="135" text-anchor="middle">(SPA)</text>
  <g class="nho">
    <rect class="lop" x="360" y="155" width="190" height="44" rx="6"/><text x="455" y="183" text-anchor="middle">React 18</text>
    <rect class="lop" x="360" y="209" width="190" height="44" rx="6"/><text x="455" y="237" text-anchor="middle">React Router (điều hướng)</text>
    <rect class="lop" x="360" y="263" width="190" height="44" rx="6"/><text x="455" y="291" text-anchor="middle">Zustand (trạng thái)</text>
    <rect class="lop" x="360" y="317" width="190" height="44" rx="6"/><text x="455" y="345" text-anchor="middle">Axios (gọi API)</text>
    <rect class="lop" x="360" y="371" width="190" height="44" rx="6"/><text x="455" y="399" text-anchor="middle">Vite (công cụ build)</text>
  </g>
  <text class="nho" x="455" y="455" text-anchor="middle">Giao diện theo vai trò</text>

  <!-- ===== Cot 3: tang nghiep vu ===== -->
  <rect class="tang" x="640" y="60" width="500" height="560" rx="10"/>
  <text class="tieude" x="890" y="45" text-anchor="middle">Tầng xử lý nghiệp vụ (Node.js 22 + Express 5)</text>
  <g>
    <rect class="lop" x="660" y="80" width="270" height="78" rx="6"/>
    <text class="ten" x="795" y="108" text-anchor="middle">Routes</text>
    <text class="nho" x="795" y="132" text-anchor="middle">xác thực JWT, kiểm tra vai trò</text>
    <text class="nho" x="795" y="151" text-anchor="middle">(middleware)</text>
    <rect class="lop" x="660" y="178" width="270" height="62" rx="6"/>
    <text class="ten" x="795" y="205" text-anchor="middle">Controller</text>
    <text class="nho" x="795" y="228" text-anchor="middle">nhận / trả dữ liệu HTTP (JSON)</text>
    <rect class="lop" x="660" y="260" width="270" height="100" rx="6"/>
    <text class="ten" x="795" y="287" text-anchor="middle">Service</text>
    <text class="nho" x="795" y="310" text-anchor="middle">quy tắc nghiệp vụ, tiến độ đơn,</text>
    <text class="nho" x="795" y="330" text-anchor="middle">phân quyền theo dữ liệu,</text>
    <text class="nho" x="795" y="350" text-anchor="middle">giao dịch (transaction)</text>
    <rect class="lop" x="660" y="380" width="270" height="62" rx="6"/>
    <text class="ten" x="795" y="407" text-anchor="middle">Repository</text>
    <text class="nho" x="795" y="430" text-anchor="middle">truy vấn SQL qua driver pg</text>
    <path class="mui" d="M795,158 V176"/><path class="mui" d="M795,240 V258"/><path class="mui" d="M795,360 V378"/>
  </g>
  <text class="nhan" x="795" y="470" text-anchor="middle">Mỗi module nghiệp vụ gồm đủ 4 lớp:</text>
  <text class="nho" x="795" y="492" text-anchor="middle">đơn hàng, khách hàng, vật tư, nhà cung cấp,</text>
  <text class="nho" x="795" y="512" text-anchor="middle">mua hàng, thi công, chi tiền &amp; công nợ,</text>
  <text class="nho" x="795" y="532" text-anchor="middle">thu tiền khách, thông báo, trợ lý AI…</text>

  <rect class="tichhop" x="965" y="80" width="160" height="362" rx="6"/>
  <text class="ten" x="1045" y="108" text-anchor="middle">Tầng tích hợp</text>
  <g class="nho">
    <rect class="khung" x="975" y="124" width="140" height="82" rx="5"/>
    <text x="1045" y="148" text-anchor="middle">Telegram client</text><text x="1045" y="170" text-anchor="middle">+ bộ điều phối</text><text x="1045" y="192" text-anchor="middle">phản hồi</text>
    <rect class="khung" x="975" y="218" width="140" height="58" rx="5"/>
    <text x="1045" y="242" text-anchor="middle">Gemini client</text><text x="1045" y="264" text-anchor="middle">(thử lại, dự phòng)</text>
    <rect class="khung" x="975" y="288" width="140" height="58" rx="5"/>
    <text x="1045" y="312" text-anchor="middle">Sinh mã QR</text><text x="1045" y="334" text-anchor="middle">VietQR</text>
    <rect class="khung" x="975" y="358" width="140" height="70" rx="5"/>
    <text x="1045" y="382" text-anchor="middle">Lưu ảnh bill</text><text x="1045" y="404" text-anchor="middle">(kiểm tra định</text><text x="1045" y="422" text-anchor="middle">dạng thật)</text>
  </g>
  <path class="mui" d="M932,310 H963"/>

  <!-- ===== Cot 4: tang du lieu ===== -->
  <rect class="tang" x="1190" y="60" width="290" height="440" rx="10"/>
  <text class="tieude" x="1335" y="45" text-anchor="middle">Tầng dữ liệu</text>
  <g>
    <path class="khung" d="M1225,110 v190 a110,26 0 0 0 220,0 v-190"/>
    <ellipse class="khung" cx="1335" cy="110" rx="110" ry="26"/>
    <text class="ten" x="1335" y="170" text-anchor="middle">PostgreSQL 16</text>
    <text class="nho" x="1335" y="198" text-anchor="middle">28 bảng, ràng buộc CHECK,</text>
    <text class="nho" x="1335" y="220" text-anchor="middle">EXCLUDE, khoá ngoại</text>
    <text class="nho" x="1335" y="242" text-anchor="middle">view v_don_hang_tien</text>
    <text class="nho" x="1335" y="264" text-anchor="middle">trigger, migration</text>
  </g>
  <rect class="khung" x="1225" y="370" width="220" height="100" rx="8"/>
  <text class="ten" x="1335" y="402" text-anchor="middle">Thư mục uploads</text>
  <text class="nho" x="1335" y="428" text-anchor="middle">ảnh bill chuyển khoản</text>
  <text class="nho" x="1335" y="450" text-anchor="middle">(xem qua API có đăng nhập)</text>

  <!-- ===== Hang duoi: dich vu ngoai ===== -->
  <rect class="tang" x="320" y="680" width="1160" height="200" rx="10"/>
  <text class="tieude" x="335" y="667" text-anchor="start">Dịch vụ bên ngoài</text>
  <rect class="ngoai" x="345" y="705" width="360" height="155" rx="8"/>
  <text class="ten" x="525" y="735" text-anchor="middle">Telegram Bot API</text>
  <rect class="lop" x="365" y="752" width="155" height="90" rx="6"/>
  <text class="nho" x="442" y="778" text-anchor="middle">Nhóm duyệt chi</text><text class="nho" x="442" y="800" text-anchor="middle">duyệt / từ chối,</text><text class="nho" x="442" y="822" text-anchor="middle">xác nhận đã chi</text>
  <rect class="lop" x="530" y="752" width="155" height="90" rx="6"/>
  <text class="nho" x="607" y="778" text-anchor="middle">Nhóm nhà cung cấp</text><text class="nho" x="607" y="800" text-anchor="middle">cho xuất hàng /</text><text class="nho" x="607" y="822" text-anchor="middle">yêu cầu cọc</text>
  <rect class="ngoai" x="760" y="705" width="300" height="155" rx="8"/>
  <text class="ten" x="910" y="745" text-anchor="middle">Google Gemini API</text>
  <text class="nho" x="910" y="775" text-anchor="middle">trích xuất đơn hàng từ</text>
  <text class="nho" x="910" y="797" text-anchor="middle">tin nhắn / ảnh chụp;</text>
  <text class="nho" x="910" y="819" text-anchor="middle">nhận xét số liệu phân tích</text>
  <rect class="ngoai" x="1110" y="705" width="345" height="155" rx="8"/>
  <text class="ten" x="1282" y="745" text-anchor="middle">VietQR (img.vietqr.io)</text>
  <text class="nho" x="1282" y="775" text-anchor="middle">ảnh mã QR chuyển khoản:</text>
  <text class="nho" x="1282" y="797" text-anchor="middle">ngân hàng, số tài khoản,</text>
  <text class="nho" x="1282" y="819" text-anchor="middle">số tiền, nội dung chứa mã đơn</text>

  <!-- ===== Mui ten giua cac tang ===== -->
  <path class="mui" d="M250,230 H338"/>
  <text class="nhan" x="294" y="220" text-anchor="middle">HTTPS</text>
  <path class="mui" d="M250,460 C300,460 300,420 338,420"/>
  <path class="mui2" d="M572,150 C610,150 615,119 658,119"/>
  <text class="nhan" x="612" y="178" text-anchor="middle">REST API</text>
  <text class="nhan" x="612" y="196" text-anchor="middle">JSON + JWT</text>
  <path class="mui2" d="M932,425 C950,425 950,462 975,462 H1160 C1195,462 1195,300 1223,300"/>
  <text class="nhan" x="1085" y="482" text-anchor="middle">SQL (driver pg)</text>
  <path class="mui2" d="M1115,395 C1170,395 1180,420 1223,420"/>
  <path class="mui2" d="M1000,444 C1000,520 990,560 900,580 C640,630 540,650 525,703"/>
  <text class="nhan" x="720" y="606" text-anchor="middle">HTTPS · long polling / webhook</text>
  <path class="mui" d="M1045,444 C1045,560 925,620 910,703"/>
  <text class="nhan" x="1000" y="612" text-anchor="middle">HTTPS</text>
  <path class="mui" d="M1095,444 C1150,560 1270,620 1282,703"/>
  <text class="nhan" x="1225" y="606" text-anchor="middle">link ảnh QR</text>
  <path class="mui2" d="M145,600 C145,700 250,782 343,782"/>
</svg>
</body></html>
